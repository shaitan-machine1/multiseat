<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.decoupling.multiseatd1"/>
    <deny receive_sender="org.decoupling.multiseatd1"/>
  </policy>
  <policy user="root">
    <allow own="org.decoupling.multiseatd1"/>
    <allow send_destination="org.decoupling.multiseatd1"/>
    <allow receive_sender="org.decoupling.multiseatd1"/>
  </policy>
</busconfig>
