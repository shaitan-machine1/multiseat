[workspace]
resolver = "2"
members = ["crates/multiseatd", "crates/seat-launch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.31", features = ["fs", "ioctl", "process", "signal", "socket", "uio", "user"] }
rustix = { version = "1.1", features = ["fs", "process"] }
seat-udev = { git = "ssh://git@github.com/shaitan-machine1/seat-udev.git", tag = "v0.1.0" }
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
