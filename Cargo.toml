[workspace]
resolver = "2"
members = [
  "crates/multiseat-api",
  "crates/multiseatd",
  "crates/seat-launch",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
multiseat-api = { path = "crates/multiseat-api" }
nix = { version = "0.31", features = ["fs", "ioctl", "process", "signal", "socket", "uio", "user"] }
rustix = { version = "1.1", features = ["fs", "process"] }
seat-udev = { git = "ssh://git@github.com/shaitan-machine1/seat-udev.git", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
